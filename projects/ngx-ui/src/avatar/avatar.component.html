@let _image = image(); @let _initials = initials();

<span
	class="wavatar"
	[class]="[
		'wavatar--' + size(),
		'wavatar--' + shape(),
		extraClass() || ''
	]"
>
	@if (_image) {
	<img class="wavatar__image" [src]="_image" [alt]="label() || ''" />
	} @else if (_initials) {
	<span class="wavatar__initials">{{ _initials }}</span>
	} @else {
	<span class="wavatar__icon material-icons" aria-hidden="true">{{
		icon()
	}}</span>
	}
</span>
