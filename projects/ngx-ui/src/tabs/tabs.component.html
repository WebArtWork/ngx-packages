<div class="wtabs">
	<div class="wtabs__nav" role="tablist">
		@for (panel of panels(); track panel; let i = $index) {
		<button
			type="button"
			role="tab"
			class="wtabs__nav-item"
			[id]="tabId(i)"
			[attr.aria-controls]="panelId(i)"
			[class._active]="activeIndex() === i"
			[class._disabled]="panel.disabled()"
			[attr.aria-selected]="activeIndex() === i ? 'true' : 'false'"
			[attr.tabindex]="activeIndex() === i ? 0 : -1"
			[disabled]="panel.disabled()"
			(click)="select(i)"
			(keydown)="onKeydown($event, i)"
		>
			<span [translate]="panel.header()"></span>
		</button>
		}
	</div>

	<div class="wtabs__body">
		<ng-content></ng-content>
	</div>
</div>
