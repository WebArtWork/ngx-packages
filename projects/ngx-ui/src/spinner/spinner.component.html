<svg
	class="wspinner"
	[class]="extraClass() || ''"
	[style.width]="size()"
	[style.height]="size()"
	viewBox="0 0 50 50"
	role="status"
	aria-label="Loading"
>
	<circle
		class="wspinner__track"
		cx="25"
		cy="25"
		r="20"
		fill="none"
		[attr.stroke-width]="strokeWidth()"
	></circle>
	<circle
		class="wspinner__arc"
		cx="25"
		cy="25"
		r="20"
		fill="none"
		[attr.stroke-width]="strokeWidth()"
	></circle>
</svg>
